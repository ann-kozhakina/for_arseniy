<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Какая цивилизация тебе по душе</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .quiz-screen {
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        .quiz-screen.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Стартовый экран */
        .start-screen {
            background: linear-gradient(135deg, #0077b6 0%, #f05452 100%);
            text-align: center;
            color: white;
        }

        .subtitle {
            font-size: 22px;
            margin-bottom: 40px;
            opacity: 0.95;
            line-height: 1.8;
            font-weight: 500;
            font-style: italic;
            letter-spacing: 0.3px;
        }

        .start-btn {
            padding: 16px 40px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 2px solid white;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-3px);
        }

        /* Вопросы */
        .question-screen {
            background: white;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0077b6 0%, #f05452 100%);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .question-number {
            color: #0077b6;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-style: italic;
        }

        .question-title {
            font-size: 32px;
            font-weight: 800;
            color: #0a0e27;
            margin-bottom: 35px;
            line-height: 1.3;
            font-style: italic;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 18px 24px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
        }

        .option-btn:hover {
            border-color: #0077b6;
            background: #f5f5f5;
            transform: translateX(8px);
        }

        .option-btn.path1 {
            border-left: 4px solid #999;
        }

        .option-btn.path2 {
            border-left: 4px solid #999;
        }

        .option-btn.selected.path1 {
            background: #e8e8e8;
            border-color: #999;
        }

        .option-btn.selected.path2 {
            background: #e8e8e8;
            border-color: #999;
        }

        .next-btn {
            display: none;
        }

        /* Результат */
        .result-screen {
            background: white;
            text-align: center;
        }

        .result-screen.path1 {
            background: linear-gradient(135deg, #fff3f0 0%, #ffe8e4 100%);
        }

        .result-screen.path2 {
            background: linear-gradient(135deg, #e1f3fd 0%, #e3f2fd 100%);
        }

        .result-icon {
            font-size: 100px;
            margin: 20px 0;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-title {
            font-size: 40px;
            font-weight: 800;
            margin: 15px 0;
            color: #0a0e27;
            font-style: italic;
            letter-spacing: -0.5px;
        }

        .result-description {
            font-size: 16px;
            color: #333;
            line-height: 1.8;
            margin: 25px 0 35px 0;
            font-weight: 500;
        }

        .photo-section {
            margin: 30px 0;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #0077b6;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-style: italic;
        }

        #photoInput {
            display: none;
        }

        .upload-btn {
            padding: 14px 28px;
            background: linear-gradient(90deg, #0077b6 0%, #005a94 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 119, 182, 0.4);
        }

        .upload-btn.hidden {
            display: none;
        }

        #previewContainer {
            margin: 25px 0;
            text-align: center;
        }

        #previewCanvas {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn-download {
            padding: 12px 24px;
            background: linear-gradient(90deg, #0077b6 0%, #f05452 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn-download.ready {
            display: block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 8px 20px rgba(0, 119, 182, 0.4);
            }
            50% {
                box-shadow: 0 8px 30px rgba(240, 84, 82, 0.5);
            }
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-restart {
            padding: 12px 20px;
            background: transparent;
            color: #0077b6;
            border: none;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 40px;
            text-decoration: underline;
            font-weight: 600;
            font-style: italic;
        }

        .btn-restart:hover {
            color: #f05452;
            text-decoration-thickness: 2px;
        }

        #resultCanvas {
            display: none;
        }

        .no-preview-message {
            color: #999;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Стартовый экран -->
        <div class="quiz-screen active start-screen">
            <p class="subtitle">Пройди увлекательный квест из семи вопросов и узнай, какая древняя цивилизация близка твоей душе. 🏛️⚔️</p>
            <button class="start-btn" onclick="startQuiz()">Начать</button>
        </div>

        <!-- Вопросы -->
        <div id="quizContainer"></div>

        <!-- Результат -->
        <div id="resultContainer"></div>
    </div>

    <canvas id="resultCanvas"></canvas>

    <script>
        const questions = [
            {
                question: "Если ты сильно голоден, что выбираешь?",
                options: [
                    { text: "🍝 Полента со сливочным маслом", type: "path1" },
                    { text: "🍪 Хрустящую мадзу", type: "path2" }
                ]
            },
            {
                question: "Какой боевой инструмент тебе больше нравится?",
                options: [
                    { text: "🎯 Катапульта 'та-та-та!'", type: "path1" },
                    { text: "🗡️ Копьё 'вперёд!'", type: "path2" }
                ]
            },
            {
                question: "Где бы ты пошёл селфи делать?",
                options: [
                    { text: "🏛️ В грандиозный амфитеатр", type: "path1" },
                    { text: "🏰 На священный холм с храмом", type: "path2" }
                ]
            },
            {
                question: "Как бы ты сражался в армии?",
                options: [
                    { text: "🛡️ В боевых доспехах с железной дисциплиной", type: "path1" },
                    { text: "📐 В боевом строю, защищая товарищей", type: "path2" }
                ]
            },
            {
                question: "Какой полководец тебе больше нравится?",
                options: [
                    { text: "⚔️ Фемистокл или Мильтиад — стратеги", type: "path2" },
                    { text: "🦅 Юлий Цезарь — завоеватель", type: "path1" }
                ]
            },
            {
                question: "Какой город ты бы основал?",
                options: [
                    { text: "🌊 Морской центр мудрости и культуры", type: "path2" },
                    { text: "⚔️ Военный центр силы и величия", type: "path1" }
                ]
            },
            {
                question: "Кому бы ты доверил свою жизнь в бою?",
                options: [
                    { text: "💪 Воину, который сражается до конца за честь", type: "path2" },
                    { text: "🛡️ Легионеру с железной дисциплиной и стойкостью", type: "path1" }
                ]
            }
        ];

        let currentQuestion = 0;
        let score = { path1: 0, path2: 0 };
        let selectedAnswer = null;
        let uploadedPhoto = null;
        let resultType = null;

        function startQuiz() {
            document.querySelector('.start-screen').classList.remove('active');
            showQuestion();
        }

        function showQuestion() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            const q = questions[currentQuestion];
            const progress = ((currentQuestion + 1) / questions.length) * 100;

            // Миксуем порядок ответов случайно
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            const html = `
                <div class="quiz-screen active question-screen">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="question-number">Вопрос ${currentQuestion + 1} из ${questions.length}</div>
                    <div class="question-title">${q.question}</div>
                    <div class="options">
                        ${shuffledOptions.map((opt, idx) => `
                            <button class="option-btn ${opt.type}" onclick="selectAnswer(${idx}, '${opt.type}')">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Далее</button>
                </div>
            `;
            container.innerHTML = html;
        }

        function selectAnswer(index, type) {
            selectedAnswer = type;
            score[selectedAnswer]++;
            currentQuestion++;

            // Небольшая задержка для визуального эффекта выделения
            setTimeout(() => {
                if (currentQuestion < questions.length) {
                    selectedAnswer = null;
                    showQuestion();
                } else {
                    showResult();
                }
            }, 300);
        }

        function nextQuestion() {
            // Функция больше не нужна, так как используется прямой переход в selectAnswer
        }

        function showResult() {
            const isPath1 = score.path1 > score.path2;
            resultType = isPath1 ? 'path1' : 'path2';

            // Скрываем вопросы
            document.getElementById('quizContainer').style.display = 'none';

            const container = document.getElementById('resultContainer');

            const resultHTML = `
                <div class="quiz-screen active result-screen ${resultType}">
                    <div class="result-icon">${isPath1 ? '👑' : '🦉'}</div>
                    <div class="result-title">${isPath1 ? 'Ты настоящий Римлянин!' : 'Ты настоящий Афинянин!'}</div>
                    <div class="result-description">
                        ${isPath1
                            ? '🦅 Ты воплощение мощи и величия! Ты ценишь дисциплину, завоевания и величие империи. Твой дух — дух легионера, готового завоевывать миры!'
                            : '🏛️ Ты воплощение мудрости и свободы! Ты ценишь культуру, философию и демократию. Твой дух — дух героя, защищающего свободу!'}
                    </div>

                    <div class="photo-section">
                        <label class="upload-label">🎬 Создай свой портрет</label>
                        <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(event)">
                        <button class="upload-btn" onclick="document.getElementById('photoInput').click()">Загрузить фотографию</button>

                        <div id="previewContainer"></div>

                        <button class="btn-download" id="downloadBtn" onclick="downloadResult()">📥 Скачай себе новую аватарку</button>
                    </div>

                    <button class="btn-restart" onclick="location.reload()">Начать заново</button>
                </div>
            `;
            container.innerHTML = resultHTML;
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedPhoto = e.target.result;
                    const img = new Image();
                    img.onload = () => {
                        createPreview(img);
                    };
                    img.onerror = () => {
                        console.error('Error loading image');
                    };
                    img.src = uploadedPhoto;
                };
                reader.readAsDataURL(file);
            }
        }

        function createPreview(img) {
            const container = document.getElementById('previewContainer');

            // Кропим фото в квадрат
            const size = Math.min(img.width, img.height);
            const startX = (img.width - size) / 2;
            const startY = (img.height - size) / 2;

            // Создаем canvas для квадратного превью
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Рисуем кропленную фотографию
            ctx.drawImage(img, startX, startY, size, size, 0, 0, size, size);

            // Загружаем и рисуем рамку поверх
            loadAndDrawFrame(ctx, size, resultType, () => {
                // Показываем превью
                container.innerHTML = '';
                container.appendChild(canvas);
                canvas.style.maxWidth = '100%';
                canvas.style.maxHeight = '400px';
                canvas.style.borderRadius = '12px';
                canvas.style.boxShadow = '0 8px 20px rgba(0, 0, 0, 0.2)';
                canvas.style.pointerEvents = 'none';
                canvas.id = 'previewCanvas';

                // Скрываем кнопку загрузки
                const uploadBtn = document.querySelector('.upload-btn');
                uploadBtn.classList.add('hidden');

                // Показываем кнопку скачать с анимацией
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.classList.add('ready');

                // Сохраняем canvas для скачивания
                window.previewCanvas = canvas;
            });
        }

        // Загрузка PNG файлов с украшениями
        function loadAndDrawFrame(ctx, size, resultType, callback) {
            // Рамка убрана - переходим сразу к добавлению аксессуара
            loadAndDrawAccessory(ctx, size, resultType, callback);
        }

        function loadAndDrawAccessory(ctx, size, resultType, callback) {
            // Для Рима - шлем, для Афин - колонна
            const isRome = resultType === 'path1';
            const accessoryFile = isRome ? 'helmet.png' : 'column.png';

            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = () => {
                // Размер аксессуара - меньше (25% вместо 40%)
                const accessorySize = Math.floor(size * 0.25);
                // Позиция в правом нижнем углу (очень близко к краю)
                const posX = size - accessorySize - Math.floor(size * 0.02);
                const posY = size - accessorySize - Math.floor(size * 0.02);

                ctx.drawImage(img, posX, posY, accessorySize, accessorySize);
                callback();
            };

            img.onerror = () => {
                console.error('Error loading ' + accessoryFile);
                callback();
            };

            img.src = accessoryFile;
        }

        function drawOverlay(ctx, type, width, height) {
            if (type === 'path1') {
                // Венок на голову
                drawLaurelWreath(ctx, width / 2, height * 0.12);
            } else {
                // Сова на плече
                drawSimpleOwl(ctx, width * 0.82, height * 0.32);
            }
        }

        function drawLaurelWreath(ctx, x, y) {
            ctx.save();

            const goldColor = '#D4AF37';
            const leafGold = '#FFD700';
            const leafDarkGold = '#FFC700';

            // Основные ветви венка (изогнутые)
            ctx.strokeStyle = goldColor;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Левая изогнутая ветвь
            ctx.beginPath();
            ctx.moveTo(x - 45, y + 35);
            ctx.quadraticCurveTo(x - 50, y, x - 25, y - 25);
            ctx.stroke();

            // Правая изогнутая ветвь
            ctx.beginPath();
            ctx.moveTo(x + 45, y + 35);
            ctx.quadraticCurveTo(x + 50, y, x + 25, y - 25);
            ctx.stroke();

            // Рисуем листья вдоль ветвей
            const leafPositions = [
                { x: x - 42, y: y + 25, angle: -25, color: leafGold },
                { x: x - 38, y: y + 10, angle: -15, color: leafDarkGold },
                { x: x - 28, y: y - 15, angle: -5, color: leafGold },
                { x: x - 15, y: y - 30, angle: 10, color: leafDarkGold },
                { x: x + 42, y: y + 25, angle: 25, color: leafGold },
                { x: x + 38, y: y + 10, angle: 15, color: leafDarkGold },
                { x: x + 28, y: y - 15, angle: 5, color: leafGold },
                { x: x + 15, y: y - 30, angle: -10, color: leafDarkGold }
            ];

            leafPositions.forEach(leaf => {
                ctx.save();
                ctx.translate(leaf.x, leaf.y);
                ctx.rotate((leaf.angle * Math.PI) / 180);
                ctx.fillStyle = leaf.color;
                ctx.globalAlpha = 0.85;
                ctx.beginPath();
                ctx.ellipse(0, 0, 8, 14, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Декоративное основание венка (две маленькие ветки внизу)
            ctx.strokeStyle = goldColor;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(x, y + 40, 35, 0.3, Math.PI - 0.3, false);
            ctx.stroke();

            ctx.restore();
        }

        function drawSimpleOwl(ctx, x, y) {
            ctx.save();

            const bodyColor = '#6B5B95';
            const accentColor = '#9370DB';
            const eyeColor = 'white';
            const pupilColor = '#1a1a2e';
            const beakColor = '#E8A83A';

            // Основное тело совы (более округлое и элегантное)
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.ellipse(x, y + 6, 28, 36, 0, 0, Math.PI * 2);
            ctx.fill();

            // Грудка (светлая полоса по центру)
            ctx.fillStyle = accentColor;
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.ellipse(x, y + 8, 16, 28, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Голова (верхняя часть)
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.ellipse(x, y - 14, 26, 32, 0, 0, Math.PI * 2);
            ctx.fill();

            // Пёрышки на голове (два небольших наростов)
            ctx.beginPath();
            ctx.moveTo(x - 15, y - 35);
            ctx.quadraticCurveTo(x - 18, y - 42, x - 14, y - 45);
            ctx.quadraticCurveTo(x - 12, y - 42, x - 10, y - 35);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x + 15, y - 35);
            ctx.quadraticCurveTo(x + 18, y - 42, x + 14, y - 45);
            ctx.quadraticCurveTo(x + 12, y - 42, x + 10, y - 35);
            ctx.fill();

            // Левый глаз
            ctx.fillStyle = eyeColor;
            ctx.beginPath();
            ctx.ellipse(x - 10, y - 18, 11, 13, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Правый глаз
            ctx.beginPath();
            ctx.ellipse(x + 10, y - 18, 11, 13, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Левый зрачок (смотрит вниз-вперёд)
            ctx.fillStyle = pupilColor;
            ctx.beginPath();
            ctx.arc(x - 9, y - 14, 6, 0, Math.PI * 2);
            ctx.fill();

            // Правый зрачок
            ctx.beginPath();
            ctx.arc(x + 9, y - 14, 6, 0, Math.PI * 2);
            ctx.fill();

            // Отражение в глазах (белые точки для живого взгляда)
            ctx.fillStyle = 'white';
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(x - 11, y - 16, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 7, y - 16, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Клюв (изящный треугольник)
            ctx.fillStyle = beakColor;
            ctx.beginPath();
            ctx.moveTo(x - 4, y - 4);
            ctx.lineTo(x + 4, y - 4);
            ctx.lineTo(x, y + 5);
            ctx.fill();

            // Мини-клюв (нижняя часть)
            ctx.fillStyle = '#D4860A';
            ctx.beginPath();
            ctx.moveTo(x - 2, y + 2);
            ctx.lineTo(x + 2, y + 2);
            ctx.lineTo(x, y + 6);
            ctx.fill();

            // Лапки (две маленькие линии внизу)
            ctx.strokeStyle = beakColor;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(x - 10, y + 40);
            ctx.lineTo(x - 10, y + 48);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + 10, y + 40);
            ctx.lineTo(x + 10, y + 48);
            ctx.stroke();

            ctx.restore();
        }

        function downloadResult() {
            if (window.previewCanvas) {
                try {
                    const dataUrl = window.previewCanvas.toDataURL('image/png');
                    const fileName = `avatar-${resultType}-${Date.now()}.png`;

                    // Для мобильных устройств
                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

                    if (isMobile) {
                        // На мобилке открываем картинку в новой вкладке
                        const link = document.createElement('a');
                        link.href = dataUrl;
                        link.target = '_blank';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    } else {
                        // На ПК скачиваем файл
                        const a = document.createElement('a');
                        a.href = dataUrl;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }
                } catch (error) {
                    console.error('Ошибка при сохранении:', error);
                    alert('Не удалось сохранить аватарку. Попробуй ещё раз.');
                }
            }
        }
    </script>
</body>
</html>
